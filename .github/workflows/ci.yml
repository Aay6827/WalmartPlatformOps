name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check services

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, checkout]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: services/${{ matrix.service }}
      - run: python -m pytest
        working-directory: services/${{ matrix.service }}

  image:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, checkout]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v5

      - name: Compute image name (GHCR requires lowercase)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/walmartplatformops-${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${SHORT_SHA}" services/${{ matrix.service }}

      - name: Scan with Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${IMAGE}:${SHORT_SHA}"

      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "${IMAGE}:${SHORT_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:latest"

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
      - name: Helm lint and schema validation
        run: |
          helm version --short
          for svc in inventory checkout; do
            helm lint deploy/helm/service -f deploy/helm/values/$svc.yaml
            helm template $svc deploy/helm/service -f deploy/helm/values/$svc.yaml --namespace platform \
              | ./kubeconform -strict -summary -kubernetes-version 1.31.0
            helm template $svc deploy/helm/service -f deploy/helm/values/$svc.yaml --namespace platform \
              --set autoscaling.enabled=true \
              | ./kubeconform -strict -summary -kubernetes-version 1.31.0
          done

  deploy-test:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Ensure kind is installed
        run: |
          if ! command -v kind >/dev/null; then
            curl -sSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
            sudo install kind /usr/local/bin/kind
          fi
          kind version
          helm version --short
          kubectl version --client

      - name: Create kind cluster
        run: kind create cluster --config deploy/kind/kind-config.yaml --wait 120s

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Enforce the restricted Pod Security profile on the platform namespace (a non-compliant pod fails the deploy)
        run: |
          kubectl create namespace platform
          kubectl label namespace platform pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest

      - name: Deploy the images built for this commit
        run: |
          pwsh -NoProfile -File scripts/deploy-kind.ps1 -Tag "${GITHUB_SHA::7}" -LoadImages

      - name: Smoke test, including the inventory outage drill
        run: pwsh -NoProfile -File scripts/smoke-test.ps1 -Chaos

      - name: Install metrics-server (the HPA needs CPU numbers)
        run: pwsh -NoProfile -File scripts/install-metrics-server.ps1

      - uses: grafana/setup-k6-action@v1

      - name: Short load test against the deployed checkout (thresholds are the SLOs)
        run: |
          k6 run --quiet -e BASE_URL=http://localhost:31000 -e BASE_RPS=5 -e PEAK_RPS=30 -e WARM=5s -e RAMP=10s -e HOLD=20s -e COOL=5s load-tests/checkout.js
          kubectl -n platform get hpa

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n platform describe pods || true
          kubectl -n platform logs -l app.kubernetes.io/part-of=walmart-platform-ops --all-containers --tail=80 || true

  monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: promtool check and unit-test the SLO rules (same Prometheus version as the cluster)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/w:ro" prom/prometheus:v3.5.0 check rules /w/slo.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/w:ro" -w /w/tests prom/prometheus:v3.5.0 test rules slo.rules.test.yml
      - name: Validate the monitoring manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize deploy/monitoring | ./kubeconform -strict -summary -kubernetes-version 1.31.0
          kubectl kustomize deploy/metrics-server | ./kubeconform -strict -summary -kubernetes-version 1.31.0
          kubectl kustomize deploy/argocd | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -skip CustomResourceDefinition
          ./kubeconform -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' deploy/argocd/root-app.yaml deploy/argocd/apps

  load-test-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: grafana/setup-k6-action@v1
      - name: k6 inspect (the script parses and its options are valid)
        run: k6 inspect load-tests/checkout.js

  promote:
    # GitOps hand-off: only images that passed the kind deploy test are written into the values files; Argo CD does the rest.
    needs: deploy-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Point the Helm values at the images built for this commit
        run: |
          TAG="${GITHUB_SHA::7}"
          for svc in inventory checkout; do
            sed -i -E "s/^(  tag: )\"?[^\" #]+\"?/\1\"${TAG}\"/" "deploy/helm/values/${svc}.yaml"
          done
          git diff --stat
          if git diff --quiet; then
            echo "Values already point at ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): promote images to ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  config-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Render the manifests this repo owns
        run: |
          mkdir -p scan
          for svc in inventory checkout; do
            helm template $svc deploy/helm/service -f deploy/helm/values/$svc.yaml --namespace platform > scan/$svc.yaml
          done
          kubectl kustomize deploy/monitoring > scan/monitoring.yaml
          kubectl kustomize deploy/metrics-server > scan/metrics-server.yaml
          cp -r services scan/services
      - name: Trivy misconfiguration scan (HIGH and CRITICAL fail the build)
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz | tar xz trivy
          ./trivy config --severity HIGH,CRITICAL --exit-code 1 scan

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks over the whole git history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .