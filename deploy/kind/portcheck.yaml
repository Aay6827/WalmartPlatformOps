apiVersion: apps/v1
kind: Deployment
metadata:
  name: portcheck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portcheck
  template:
    metadata:
      labels:
        app: portcheck
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portcheck
spec:
  type: NodePort
  selector:
    app: portcheck
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31000