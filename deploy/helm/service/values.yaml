# Defaults shared by every service. Per-service overrides live in deploy/helm/values/<service>.yaml.
replicaCount: 1

image:
  repository: ""
  tag: ""            # always set explicitly (an immutable commit sha), never "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  nodePort: null

env: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true