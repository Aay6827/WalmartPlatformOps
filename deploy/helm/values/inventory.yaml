# Inventory keeps stock in memory, so it runs as a single replica by design
# (two replicas would each hold a different copy of the stock).
replicaCount: 1

image:
  repository: ghcr.io/aay6827/walmartplatformops-inventory
  tag: "765e283"

service:
  type: ClusterIP
  port: 8000

env:
  # Plenty of stock so drills and load tests do not run out and start returning 409s.
  STOCK_PER_SKU: "100000"