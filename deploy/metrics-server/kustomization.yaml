apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# metrics-server v0.7.2, vendored unchanged in components.yaml so the HPA has CPU numbers to work with.
# kind's kubelets use self-signed certificates, so metrics-server must skip kubelet TLS verification here.
# That flag is for this local cluster only; on a real cluster the kubelet certs are signed and the patch is dropped.
resources:
  - components.yaml

patches:
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls